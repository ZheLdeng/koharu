<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Koharu Web Reader</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main>
			<h1>Koharu Web Reader</h1>
			<p>Translate the largest comic image visible in the active tab. The translated image replaces it in place.</p>
			<button id="translate" type="button">Translate / restore visible image</button>
			<div id="status" role="status" aria-live="polite">Ready</div>
		</main>
		<script src="popup.js"></script>
	</body>
</html>
